<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кто я?</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <style>
        body { touch-action: none; user-select: none; -webkit-user-select: none; }
        .screen { display: none; }
        .screen.active { display: flex; }
        .flash-green { animation: flashG 0.3s ease-out; }
        .flash-red { animation: flashR 0.3s ease-out; }
        @keyframes flashG { 0% { background-color: rgba(34, 197, 94, 0.5); } 100% { background-color: transparent; } }
        @keyframes flashR { 0% { background-color: rgba(239, 68, 68, 0.5); } 100% { background-color: transparent; } }
    </style>
</head>
<body class="bg-gray-900 text-white h-screen w-screen overflow-hidden font-sans">
    
    <!-- Главное меню -->
    <div id="menu-screen" class="screen active flex-col landscape:flex-row items-center justify-center h-full w-full p-6 text-center landscape:text-left gap-8">
        
        <div class="flex-1 max-w-sm">
            <h1 class="text-5xl md:text-6xl font-black mb-4 bg-gradient-to-r from-cyan-400 to-purple-500 bg-clip-text text-transparent">Кто я?</h1>
            <p class="text-gray-400 mb-8 text-lg">Выберите режим, колоду и приложите телефон ко лбу дисплеем к друзьям.</p>
            
            <div class="flex bg-gray-800 p-2 rounded-2xl mb-8">
                <button id="mode-time" onclick="setMode('time')" class="flex-1 py-3 rounded-xl font-bold bg-gray-600 text-white transition">На время (60с)</button>
                <button id="mode-free" onclick="setMode('free')" class="flex-1 py-3 rounded-xl font-bold text-gray-400 hover:text-white transition">Без времени</button>
            </div>
        </div>

        <div class="flex flex-col gap-4 w-full max-w-sm landscape:max-w-xs flex-1">
            <button onclick="startGame('base')" class="bg-blue-500 hover:bg-blue-600 active:bg-blue-700 py-4 rounded-2xl text-xl font-bold shadow-lg transition">Базовая (Микс)</button>
            <button onclick="startGame('movies')" class="bg-purple-500 hover:bg-purple-600 active:bg-purple-700 py-4 rounded-2xl text-xl font-bold shadow-lg transition">Кино и Сериалы</button>
            <button onclick="startGame('sport')" class="bg-green-500 hover:bg-green-600 active:bg-green-700 py-4 rounded-2xl text-xl font-bold shadow-lg transition">Спорт</button>
            <button onclick="startGame('auto')" class="bg-red-500 hover:bg-red-600 active:bg-red-700 py-4 rounded-2xl text-xl font-bold shadow-lg transition">Автомобили</button>
            <button onclick="startGame('it')" class="bg-indigo-500 hover:bg-indigo-600 active:bg-indigo-700 py-4 rounded-2xl text-xl font-bold shadow-lg transition">IT и Разработка</button>
        </div>
    </div>

    <!-- Подготовка (Отсчет 5 сек) -->
    <div id="prep-screen" class="screen flex-col items-center justify-center h-full w-full">
        <h2 class="text-3xl font-bold mb-8 text-gray-400">Приложите ко лбу!</h2>
        <div id="prep-timer" class="text-9xl font-black text-white">5</div>
    </div>

    <!-- Игровой экран -->
    <div id="game-screen" class="screen flex-col h-full w-full relative transition-colors duration-200">
        <div class="absolute top-0 left-0 w-full p-6 flex justify-between items-center z-50 pointer-events-none">
            <div id="timer" class="text-3xl md:text-5xl font-black text-yellow-400">60</div>
            <button id="btn-finish" class="text-gray-300 text-lg md:text-xl font-bold bg-gray-800/80 backdrop-blur px-6 py-3 rounded-full pointer-events-auto active:bg-gray-700">Завершить</button>
        </div>
        
        <div class="flex-1 flex items-center justify-center z-10 pointer-events-none p-8 w-full h-full">
            <h2 id="current-word" class="text-[12vw] landscape:text-[15vh] font-black text-center break-words leading-tight w-full drop-shadow-lg">Слово</h2>
        </div>

        <div class="absolute top-0 left-0 w-full h-full flex z-10">
            <div id="tap-left" class="flex-1 h-full flex items-end pb-12 justify-center opacity-30 hover:opacity-50 text-red-400 font-bold text-2xl md:text-4xl cursor-pointer bg-gradient-to-r from-red-500/10 to-transparent">← Пропуск</div>
            <div id="tap-right" class="flex-1 h-full flex items-end pb-12 justify-center opacity-30 hover:opacity-50 text-green-400 font-bold text-2xl md:text-4xl cursor-pointer bg-gradient-to-l from-green-500/10 to-transparent">Угадал →</div>
        </div>
    </div>

    <!-- Результаты -->
    <div id="result-screen" class="screen flex-col items-center justify-center h-full w-full p-6 text-center">
        <h2 id="result-title" class="text-4xl md:text-5xl font-bold mb-4">Время вышло!</h2>
        <p class="text-gray-400 mb-2 text-xl">Угадано слов:</p>
        <div class="text-9xl font-black text-green-400 mb-12 drop-shadow-lg" id="final-score">0</div>
        <button onclick="switchScreen('menu')" class="bg-gray-700 hover:bg-gray-600 active:bg-gray-500 py-5 px-10 rounded-2xl text-2xl font-bold shadow-lg transition">В меню</button>
    </div>

    <script>
        // Инициализация VK Bridge для прохождения модерации
        vkBridge.send('VKWebAppInit');

        // ВСЕ СЛОВА ТЕПЕРЬ ХРАНЯТСЯ ПРЯМО ЗДЕСЬ
        const databases = {
            auto: ["Двигатель","Автосалон","Haval","Шина","Сцепление","Jaecoo","Багажник","Карбюратор","Трансмиссия","Руль","Антифриз","Домкрат","Глушитель","Капот","Фара","Бампер","Радиатор","Тормоз","Колодки","Масло","Фильтр","Бензин","Дизель","Электрокар","Внедорожник","Седан","Хэтчбек","Кроссовер","Пикап","Минивэн","Трасса","Спидометр","Тахометр","Бардачок","Дворники","Поворотник","Зеркало","Амортизатор","Подвеска","Выхлоп","Аккумулятор","Генератор","Стартер","Клемма","Предохранитель","Сигнализация","Ключ","Брелок","Коврик","Чехол","Тонировка","Аэрография","Спойлер","Диск","Запаска","Насос","Манометр","Трос","Аптечка","Огнетушитель","Знак","Эвакуатор","Штраф","Радар","Светофор","Парковка","Гараж","Мойка","Заправка","Автомеханик","Клиент","Менеджер","Договор","Кредит","Страховка","ПТС","Права","Автошкола","Инструктор","Такси","Автобус","Грузовик","Фургон","Прицеп","Мотоцикл","Шлем","Байкер","Дрифт","Тюнинг","Драг-рейсинг","Ралли","Формула-1","Пит-стоп","Гонщик","Чемпион","Кубок","Медаль","Подиум","Спонсор"],
            sport: ["Хоккей","КХЛ","Буллит","Овертайм","Шайба","Клюшка","Коньки","Вратарь","Нападающий","Защитник","Тренер","Судья","Свисток","Удаление","Пенальти","Футбол","Мяч","Ворота","Стадион","Трибуна","Болельщик","Реал Мадрид","Барселона","УЕФА","Гол","Офсайд","Угловой","Аут","Тайм","Матч","Настольный теннис","Ракетка","Воланчик","Сетка","Стол","Подача","Паркет","Данк","Бокс","Ринг","Перчатки","Нокаут","Раунд","Капа","Груша","Гантели","Штанга","Блин","Турник","Брусья","Тренажер","Фитнес","Кроссфит","Йога","Скакалка","Эспандер","Бассейн","Плавки","Очки","Кроль","Брасс","Баттерфляй","Трамплин","Лыжи","Палки","Сноуборд","Склон","Подъемник","Биатлон","Винтовка","Мишень","Лед","Пируэт","Гимнастика","Обруч","Лента","Булава","Скала","Альпинизм","Карабин","Веревка","Палатка","Котелок","Компас","Карта","Рюкзак","Велосипед","Педали","Седло","Цепь","Тормоза","Ролики","Бильярд","Кий","Луза","Боулинг","Страйк","Кегля","Дартс","Дротик","Шахматы","Гроссмейстер","Мат","Эстафета"],
            it: ["Бэкенд","Фронтенд","Python","Сервер","Алгоритм","GitHub","Хостинг","Render","Веб-сокеты","UptimeRobot","VPN","База данных","Скрипт","Нейросеть","Фреймворк","Код","Программист","Разработчик","Тестировщик","Баг","Фича","Дедлайн","Спринт","Релиз","Коммит","Ветка","Репозиторий","Запрос","Ответ","Токен","Авторизация","Пароль","Логин","Интерфейс","Дизайн","Верстка","Браузер","Консоль","Терминал","Ноутбук","Монитор","Клавиатура","Мышка","Роутер","Кабель","Пинг","Лаг","Драйвер","Процессор","Видеокарта","Оперативка","Флешка","Облако","Бот","aiogram","Парсер","Таблица","Индекс","Переменная","Функция","Массив","Строка","Цикл","Ошибка","Исключение","Лог","Дебаг","Компилятор","Архитектура","Оптимизация","Безопасность","Хакер","Вирус","Антивирус","Спам","Фишинг","Брандмауэр","Домен","Порт","Протокол","Пиксель","Матрица","Смартфон","Планшет","Приложение","Уведомление","Гаджет","Микрочип","Кулер","Материнка","Шлейф","Биткоин","Майнинг","Патч","Провайдер","Шифрование","Архив","Пират","Сисадмин","Стилус"],
            base: ["Крокодил","Самолет","Пицца","Гитара","Дерево","Собака","Холодильник","Очки","Космонавт","Врач","Пожарный","Учитель","Поезд","Метро","Корабль","Вертолет","Ракета","Трактор","Банан","Яблоко","Арбуз","Картошка","Морковка","Торт","Мороженое","Конфета","Шоколад","Чай","Кофе","Молоко","Сыр","Колбаса","Нож","Вилка","Ложка","Тарелка","Кастрюля","Сковородка","Чайник","Кружка","Диван","Кровать","Шкаф","Стол","Стул","Лампа","Телевизор","Ковер","Зеркало","Часы","Книга","Тетрадь","Карандаш","Ручка","Ножницы","Клей","Бумага","Кисточка","Краски","Пластилин","Слон","Тигр","Лев","Медведь","Волк","Лиса","Заяц","Обезьяна","Пингвин","Страус","Попугай","Орел","Рыба","Акула","Кит","Дельфин","Осьминог","Краб","Лягушка","Змея","Черепаха","Паук","Муха","Комар","Бабочка","Пчела","Муравей","Солнце","Луна","Звезда","Облако","Дождь","Снег","Ветер","Гроза","Молния","Радуга","Океан","Море","Гора","Лес","Река"],
            movies: ["Гарри Поттер", "Терминатор", "Аватар", "Шрек", "Мстители", "Матрица", "Титаник", "Человек-паук", "Интерстеллар", "Властелин колец", "Пираты Карибского моря", "Форсаж", "Дюна", "Один дома", "Начало", "Голодные игры", "Сумерки", "Джон Уик", "Парк Юрского периода", "Люди в черном", "Назад в будущее", "Крестный отец", "Бойцовский клуб", "Пятый элемент"]
        };

        let activeDecks = {}; 
        let currentCategory = '';
        let score = 0;
        let gameMode = 'time'; 
        let timeLeft = 60;
        let timerInterval;

        const screens = {
            menu: document.getElementById('menu-screen'),
            prep: document.getElementById('prep-screen'),
            game: document.getElementById('game-screen'),
            result: document.getElementById('result-screen')
        };
        const ui = {
            word: document.getElementById('current-word'),
            score: document.getElementById('final-score'),
            tapLeft: document.getElementById('tap-left'),
            tapRight: document.getElementById('tap-right'),
            gameWrapper: document.getElementById('game-screen'),
            btnFinish: document.getElementById('btn-finish'),
            timer: document.getElementById('timer'),
            prepTimer: document.getElementById('prep-timer'),
            resultTitle: document.getElementById('result-title')
        };

        function switchScreen(name) {
            Object.values(screens).forEach(s => s.classList.remove('active'));
            screens[name].classList.add('active');
        }

        function setMode(mode) {
            gameMode = mode;
            document.getElementById('mode-time').className = mode === 'time' ? 'flex-1 py-3 rounded-xl font-bold bg-gray-600 text-white transition' : 'flex-1 py-3 rounded-xl font-bold text-gray-400 hover:text-white transition';
            document.getElementById('mode-free').className = mode === 'free' ? 'flex-1 py-3 rounded-xl font-bold bg-gray-600 text-white transition' : 'flex-1 py-3 rounded-xl font-bold text-gray-400 hover:text-white transition';
        }

        function shuffle(array) {
            let cur = array.length, rnd;
            while (cur !== 0) {
                rnd = Math.floor(Math.random() * cur);
                cur--;
                [array[cur], array[rnd]] = [array[rnd], array[cur]];
            }
            return array;
        }

        function startGame(category) {
            currentCategory = category;
            score = 0;
            
            if (!activeDecks[category] || activeDecks[category].length === 0) {
                activeDecks[category] = shuffle([...databases[category]]);
            }

            ui.timer.style.opacity = gameMode === 'time' ? '1' : '0';

            switchScreen('prep');
            let prepTime = 5;
            ui.prepTimer.innerText = prepTime;
            
            const prepInterval = setInterval(() => {
                prepTime--;
                ui.prepTimer.innerText = prepTime;
                if (prepTime <= 0) {
                    clearInterval(prepInterval);
                    startRound();
                }
            }, 1000);
        }

        function startRound() {
            switchScreen('game');
            nextWord();

            if (gameMode === 'time') {
                timeLeft = 60;
                ui.timer.innerText = timeLeft;
                timerInterval = setInterval(() => {
                    timeLeft--;
                    ui.timer.innerText = timeLeft;
                    if (timeLeft <= 0) {
                        endGame('Время вышло!');
                    }
                }, 1000);
            }
        }

        function nextWord() {
            if (activeDecks[currentCategory].length === 0) {
                activeDecks[currentCategory] = shuffle([...databases[currentCategory]]);
            }
            ui.word.innerText = activeDecks[currentCategory].pop();
        }

        function endGame(reason = 'Конец игры!') {
            clearInterval(timerInterval);
            ui.resultTitle.innerText = reason;
            ui.score.innerText = score;
            switchScreen('result');
        }

        function triggerFlash(colorClass) {
            ui.gameWrapper.classList.remove('flash-green', 'flash-red');
            void ui.gameWrapper.offsetWidth;
            ui.gameWrapper.classList.add(colorClass);
            setTimeout(() => ui.gameWrapper.classList.remove(colorClass), 300);
        }

        function handleTapLeft(e) {
            e.preventDefault();
            triggerFlash('flash-red');
            nextWord();
        }

        function handleTapRight(e) {
            e.preventDefault();
            score++;
            triggerFlash('flash-green');
            nextWord();
        }

        function handleFinish(e) {
            e.preventDefault();
            e.stopPropagation();
            endGame('Игра завершена');
        }

        ui.tapLeft.addEventListener('touchstart', handleTapLeft);
        ui.tapLeft.addEventListener('mousedown', handleTapLeft);
        
        ui.tapRight.addEventListener('touchstart', handleTapRight);
        ui.tapRight.addEventListener('mousedown', handleTapRight);
        
        ui.btnFinish.addEventListener('touchstart', handleFinish);
        ui.btnFinish.addEventListener('mousedown', handleFinish);
    </script>
</body>
</html>
